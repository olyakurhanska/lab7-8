{% extends 'base.html' %}

{% block title %}Список книг — Каталог книг{% endblock %}

{% block content %}
<h2>{{ title }}</h2>
<p>Усього книг: {{ count }}</p>

    {% if books %}
<ul>
    {% for book in books %}
    <li>{{ book|title }}</li>
    {% endfor %}
</ul>
    {% else %}
<p>Каталог порожній.</p>
    {% endif %}
{% endblock %}
